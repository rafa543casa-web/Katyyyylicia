<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Operação Primeiro Beijo 💋</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;1,600&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe3ef;--bg2:#f0e0ff;--ink:#4a1030;--rose:#ff4d8d;--red:#e11d48;--lilac:#a78bfa;--glass:rgba(255,255,255,.55);--edge:rgba(255,255,255,.8);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3a0f2c;--bg2:#241447;--ink:#ffe8f1;--glass:rgba(255,255,255,.1);--edge:rgba(255,255,255,.22);color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;overflow-x:hidden}
h1,h2{font-family:Fraunces,Georgia,serif;line-height:1.1;margin:0 0 .6em}
h1{font-size:clamp(1.8rem,7vw,3rem)}h2{font-size:clamp(1.5rem,6vw,2.4rem)}
main{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(540px,100%);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--edge);border-radius:28px;padding:28px 22px;box-shadow:0 20px 60px rgba(225,29,72,.18);text-align:center;animation:pop .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.94)}}
p{line-height:1.55;font-weight:500}
.btn{font:800 1.05rem Nunito;border:0;border-radius:999px;padding:15px 26px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--rose),var(--red));box-shadow:0 8px 22px rgba(225,29,72,.35);transition:transform .2s,box-shadow .2s;touch-action:manipulation}
.btn:hover{transform:translateY(-3px) scale(1.04)}.btn:active{transform:scale(.95)}
.btn.no{background:var(--glass);color:var(--ink);border:1px solid var(--edge);box-shadow:none}
.btn:focus-visible{outline:3px solid var(--lilac);outline-offset:3px}
.row{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:18px;min-height:64px}
.doc{text-align:left;background:rgba(255,255,255,.5);border-radius:16px;padding:6px 16px;margin:14px 0;border-left:5px solid var(--rose)}
.doc li{list-style:none;padding:9px 0;border-bottom:1px dashed rgba(225,29,72,.25);font-size:.97rem}.doc li:last-child{border:0}
.doc b{color:var(--red)}
.stamp{display:inline-block;border:3px solid var(--red);color:var(--red);font-weight:800;padding:2px 12px;border-radius:8px;transform:rotate(-6deg);margin-bottom:10px;letter-spacing:.08em}
.hf{position:fixed;pointer-events:none;z-index:50;will-change:transform,opacity}
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bgh{position:absolute;bottom:-40px;animation:up linear infinite;opacity:.55}
@keyframes up{to{transform:translateY(-115vh) rotate(40deg)}}
main{position:relative;z-index:1}
#top{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:60;display:flex;gap:8px;align-items:center}
.pill{background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--edge);border-radius:999px;padding:8px 12px;font:700 .78rem Nunito;color:var(--ink);cursor:pointer}
.secret{cursor:pointer;user-select:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg1);padding:10px 18px;border-radius:14px;font-weight:700;z-index:99;max-width:88vw;text-align:center;animation:pop .3s}
svg.art{width:150px;height:auto;margin:6px auto 0;display:block}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}
.kiss .l{animation:lk 1.8s ease-in-out infinite}.kiss .r{animation:rk 1.8s ease-in-out infinite}
@keyframes lk{50%{transform:translateX(22px)}}@keyframes rk{50%{transform:translateX(-22px)}}
.kiss .mw{animation:mw 1.8s ease-in-out infinite}@keyframes mw{45%,55%{opacity:1}0%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style></head><body>
<div id="bg" aria-hidden="true"></div>
<div id="top"><span class="pill" id="timer" title="Tempo pensando em você">💭 0s</span><button class="pill" id="mus" aria-label="Ligar ou desligar música">🎵 música: off</button></div>
<main><section class="card" id="stage" aria-live="polite"></section></main>
<script>
// ===== CONFIGURAÇÃO =====
const WHATSAPP_NUMBER = "5511999999999"; // DDI+DDD+número, só dígitos
const NOME = "Katy"; // nome dela
const WHATSAPP_MSG = "Oi! Vim confirmar oficialmente minha participação na operação dos beijinhos KKKKK 💋❤️";
// ========================
const $=s=>document.querySelector(s),stage=$("#stage");
const cat=`<svg class="art bob" viewBox="0 0 120 110" role="img" aria-label="Gatinho apaixonado"><path d="M22 40 L30 8 L52 28 Q60 26 68 28 L90 8 L98 40 Q108 70 88 90 Q60 108 32 90 Q12 70 22 40Z" fill="#ffd2e2" stroke="#e11d48" stroke-width="3" stroke-linejoin="round"/><path d="M42 54c-5-9-16-3-10 5l10 9 10-9c6-8-5-14-10-5z" fill="#e11d48" transform="translate(-4 -4) scale(.9)"/><path d="M78 54c-5-9-16-3-10 5l10 9 10-9c6-8-5-14-10-5z" fill="#e11d48" transform="translate(4 -4) scale(.9) translate(-6 0)"/><path d="M54 74 L60 80 L66 74Z" fill="#ff4d8d"/><path d="M60 80q-6 8-14 2M60 80q6 8 14 2" fill="none" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round"/><circle cx="30" cy="76" r="6" fill="#ff4d8d" opacity=".4"/><circle cx="90" cy="76" r="6" fill="#ff4d8d" opacity=".4"/></svg>`;
const kiss=`<svg class="art kiss" style="width:210px" viewBox="0 0 220 110" role="img" aria-label="Dois personagens se beijando"><g class="l"><circle cx="70" cy="60" r="34" fill="#ffd2e2" stroke="#e11d48" stroke-width="3"/><path d="M50 22q20-22 40 0" fill="#a78bfa" stroke="#7c5cd6" stroke-width="3"/><path d="M52 54q5-6 10 0M78 54q5-6 10 0" stroke="#4a1030" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="52" cy="68" r="6" fill="#ff4d8d" opacity=".5"/></g><g class="r"><circle cx="150" cy="60" r="34" fill="#ffe9b8" stroke="#e11d48" stroke-width="3"/><path d="M118 52q4-34 34-34q26 0 32 30q-30-4-66 4z" fill="#4a1030"/><path d="M132 56q5-6 10 0M158 56q5-6 10 0" stroke="#4a1030" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="168" cy="70" r="6" fill="#ff4d8d" opacity=".5"/></g><text class="mw" x="110" y="68" font-size="26" text-anchor="middle">💋</text></svg>`;
function hearts(n=40,x=innerWidth/2,y=innerHeight/2,emo=["❤️","💗","💖","💘","💋","✨"]){
 for(let i=0;i<n;i++){const e=document.createElement("div");e.className="hf";e.textContent=emo[Math.random()*emo.length|0];
  e.style.cssText+=`left:${x}px;top:${y}px;font-size:${14+Math.random()*26}px`;document.body.appendChild(e);
  const a=Math.random()*6.28,d=80+Math.random()*Math.min(innerWidth,500)*.7;
  e.animate([{transform:"translate(-50%,-50%) scale(.3)",opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d-80}px)) rotate(${Math.random()*80-40}deg)`,opacity:0}],{duration:1100+Math.random()*900,easing:"cubic-bezier(.1,.8,.3,1)"}).onfinish=()=>e.remove();}}
function rain(ms=6000){const t=setInterval(()=>{const e=document.createElement("div");e.className="hf";e.textContent=["❤️","💖","💋","🎉","🌸"][Math.random()*5|0];
 e.style.cssText+=`left:${Math.random()*100}vw;top:-30px;font-size:${16+Math.random()*22}px`;document.body.appendChild(e);
 e.animate([{transform:"translateY(0) rotate(0)"},{transform:`translateY(${innerHeight+60}px) rotate(${Math.random()*360}deg)`}],{duration:2500+Math.random()*2000}).onfinish=()=>e.remove()},90);setTimeout(()=>clearInterval(t),ms)}
function confetti(){const c=["#ff4d8d","#e11d48","#a78bfa","#fff","#ffd166"];for(let i=0;i<90;i++){const e=document.createElement("div");e.className="hf";
 e.style.cssText+=`left:${Math.random()*100}vw;top:-10px;width:9px;height:14px;background:${c[i%5]};border-radius:2px`;document.body.appendChild(e);
 e.animate([{transform:"translateY(0) rotate(0)"},{transform:`translate(${Math.random()*120-60}px,${innerHeight}px) rotate(${Math.random()*900}deg)`}],{duration:2200+Math.random()*2200,easing:"ease-in"}).onfinish=()=>e.remove()}}
// fundo
for(let i=0;i<14;i++){const h=document.createElement("span");h.className="bgh";h.textContent=["💗","💕","💜","🤍"][i%4];
 h.style.cssText=`left:${Math.random()*100}%;font-size:${14+Math.random()*28}px;animation-duration:${9+Math.random()*10}s;animation-delay:${-Math.random()*15}s`;$("#bg").appendChild(h)}
// coração no mouse
let lt=0;addEventListener("pointermove",e=>{if(e.pointerType!=="mouse"||Date.now()-lt<70)return;lt=Date.now();hearts(1,e.clientX,e.clientY,["💗","💕"])});
// contador
const t0=Date.now();setInterval(()=>{const s=((Date.now()-t0)/1000|0)+86400*3+4*3600;const d=s/86400|0,h=s%86400/3600|0,m=s%3600/60|0,x=s%60;
 $("#timer").textContent=`💭 pensando há ${d}d ${h}h ${m}m ${x}s`},1000);
// mensagens secretas
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
const secrets=["Psiu… você achou um segredo 🤫 (eu ensaiei isso no espelho)","Spoiler: eu fiquei nervoso fazendo este site 😳","Se você chegou até aqui, já ganhei um sorriso 😌","Eu juro que vou escovar os dentes 🪥😂"];let si=0;
document.addEventListener("click",e=>{if(e.target.closest(".secret"))toast(secrets[si++%secrets.length])});
// música (WebAudio, sem arquivos externos)
let ac,mt,on=false;const notes=[392,494,587,659,587,494,440,523,659,784,659,523];let ni=0;
function tick(){if(!on)return;const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=notes[ni++%notes.length]/2*1;g.gain.setValueAtTime(.001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.08,ac.currentTime+.05);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.9);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+1)}
$("#mus").onclick=()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();on=!on;clearInterval(mt);if(on){ac.resume();tick();mt=setInterval(tick,650)}$("#mus").textContent=on?"🎵 música: on":"🎵 música: off"}catch(e){}};
// telas
const S={
 intro:()=>`<div class="stamp">ALERTA</div><h1>🚨 ATENÇÃO, ${NOME.toUpperCase()}! VOCÊ FOI SELECIONADA PARA UMA MISSÃO ESPECIAL.</h1><p>Após uma análise extremamente séria (e vários pensamentos aleatórios), chegamos à conclusão de que precisamos conversar sobre um assunto importante…</p><div class="row"><button class="btn" id="go">DESCUBRA SUA MISSÃO 💌</button></div><p class="secret" style="font-size:.8rem;opacity:.7">(clique aqui, tem algo escondido)</p>`,
 report:()=>`<span class="stamp">CONFIDENCIAL</span><h2>📂 RELATÓRIO CONFIDENCIAL</h2>${cat}<ul class="doc"><li><b>Suspeita:</b> Você (${NOME}).</li><li><b>Investigador:</b> Um rapaz claramente interessado.</li><li><b>Ocorrência:</b> Pensar em você mais do que deveria.</li><li><b>Nível de interesse:</b> <span class="secret">1000%</span></li><li><b>Situação atual:</b> Necessidade urgente de alguns beijinhos.</li></ul><div class="row"><button class="btn" id="go">CONTINUAR A INVESTIGAÇÃO 🔎</button></div>`,
 ask:()=>`<h2>Agora falando sério, ${NOME}…</h2><p>Eu poderia inventar mil desculpas para ficar pertinho de você, mas resolvi ser direto.</p><p><b>Bora dar uns beijinhos pra ver se tu é difícil mesmo de lidar? 👀💗</b></p><p>Prometo que minha intenção é das melhores… ou quase isso KKKKK.</p><div class="row" id="opts"><button class="btn" id="yes">❤️ SIM, QUERO!</button><button class="btn no" id="no">🙄 NÃO, SEU ATREVIDO!</button></div><p id="msg" style="min-height:1.6em;font-weight:700"></p>`,
 yes:()=>`<h1>EU SABIAAAAA! KKKKKKK ❤️</h1><p>Agora só falta escolher quando vamos transformar esse site em realidade.</p><div class="row"><button class="btn" id="go">VER MEU CONTRATO 💌</button></div>`,
 final:()=>`<span class="stamp">APROVADO</span><h2>💌 CONTRATO DE BEIJINHOS APROVADO!</h2>${kiss}<p>Parabéns, ${NOME}! Você acaba de aceitar participar de uma experiência com potencial para muitos sorrisos, abraços e beijinhos.</p><div class="row"><a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(WHATSAPP_MSG)}">COMBINAR NO WHATSAPP 💬</a></div>`,
 bye:()=>`<h2>Tudo bem 🤍</h2><p>Respeito sua decisão… mas precisava tentar 😂</p><p>Obrigado por ter dado uma chance ao site (ele ficou lindo, né?).</p><div class="row"><button class="btn no" id="back">Voltar ao começo</button></div>`
};
function show(n,next){stage.innerHTML=S[n]();const g=$("#go");if(g&&next)g.onclick=()=>{g.disabled=1;stage.style.transition="opacity .3s";stage.style.opacity=0;setTimeout(()=>{stage.style.opacity=1;next()},300)};}
const finale=()=>{show("final");rain();confetti();setTimeout(()=>hearts(60),300)};
const yes=()=>{show("yes",finale);hearts(80);confetti()};
function ask(){show("ask");let n=0;const m=["Tem certeza? 🥺","Poxa, meu advogado disse que eu deveria tentar mais uma vez KKKKK.","Será que não vale pensar mais um pouquinho? 🐱"];
 $("#yes").onclick=yes;
 $("#no").onclick=ev=>{if(n>=m.length){show("bye");$("#back").onclick=()=>start();return}
  $("#msg").textContent=m[n];n++;$("#no").style.transform=`scale(${1-n*.08})`;$("#yes").style.transform=`scale(${1+n*.1})`;hearts(8,ev.clientX,ev.clientY,["🥺","💔","🤞"])}}
function start(){show("intro",()=>{show("report",()=>ask())})}
start();
</script></body></html>
